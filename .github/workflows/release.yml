name: Publish signed Daymark update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: daymark-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release tag
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME must match app version $expected."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed updater bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Daymark ${{ github.ref_name }}
          releaseBody: "Signed Daymark Windows x64 installer and updater metadata."
          releaseDraft: false
          prerelease: false
          owner: DayenM
          repo: Daymark
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
